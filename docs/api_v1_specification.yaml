openapi: 3.0.3
info:
  title: MONKAYIER REST API
  description: API v1 de la plateforme éducative MONKAYIER (Porteur KAMEHUB SERVICES SARL-U).
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Serveur de développement local

paths:
  /health:
    get:
      summary: Contrôle technique minimal du service
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "pass"
                      service:
                        type: string
                        example: "MONKAYIER API"
                      version:
                        type: string
                        example: "v1"
                      timestamp:
                        type: string
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string

  /auth/register:
    post:
      summary: Inscription publique d'un élève
      description: Crée un compte utilisateur et lui attribue par défaut et exclusivement le rôle "student".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - password
              properties:
                first_name:
                  type: string
                  example: "Koffi"
                last_name:
                  type: string
                  example: "Mensah"
                email:
                  type: string
                  format: email
                  example: "koffi.mensah@example.tg"
                phone:
                  type: string
                  example: "+22890000000"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "MonMotDePasse123!"
                preferred_language:
                  type: string
                  enum: [fr, en, ee, kbp]
                  default: fr
      responses:
        '201':
          description: Compte créé avec succès et jeton émis.
        '422':
          description: Erreur de validation des champs.

  /auth/login:
    post:
      summary: Authentification et ouverture de session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
              properties:
                login:
                  type: string
                  description: Adresse e-mail ou numéro de téléphone
                  example: "koffi.mensah@example.tg"
                password:
                  type: string
                  format: password
                  example: "MonMotDePasse123!"
                device_name:
                  type: string
                  example: "android-chrome"
      responses:
        '200':
          description: Connexion réussie et jeton Sanctum renvoyé.
        '401':
          description: Identifiant ou mot de passe incorrect (réponse générique).
        '403':
          description: Compte suspendu.

  /auth/logout:
    post:
      summary: Déconnexion et révocation du jeton côté serveur
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Jeton révoqué.

  /auth/forgot-password:
    post:
      summary: Demande de réinitialisation de mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
              properties:
                login:
                  type: string
                  example: "koffi.mensah@example.tg"
      responses:
        '200':
          description: Réponse générique anti-énumération confirmant la prise en compte.

  /me:
    get:
      summary: Consultation du profil de l'utilisateur connecté
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Données du profil et rôles actifs.
        '401':
          description: Non authentifié.
    patch:
      summary: Mise à jour des informations personnelles autorisées
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                birth_date:
                  type: string
                  format: date
                preferred_language:
                  type: string
                  enum: [fr, en, ee, kbp]
                bio:
                  type: string
      responses:
        '200':
          description: Profil mis à jour.
        '401':
          description: Non authentifié.

  /education/cycles:
    get:
      summary: Liste des cycles scolaires actifs (Primaire, Collège, Lycée, Technique)
      tags: [Education]
      responses:
        '200':
          description: Liste ordonnée des cycles.

  /education/levels:
    get:
      summary: Liste des niveaux/classes (6e à Terminale) avec filtre optionnel par cycle
      tags: [Education]
      parameters:
        - name: cycle
          in: query
          schema:
            type: string
          description: Code du cycle (ex. college, lycee)
      responses:
        '200':
          description: Niveaux scolaires correspondants.

  /education/tracks:
    get:
      summary: Liste des séries et parcours disponibles pour un niveau (ex. A4, CD, F)
      tags: [Education]
      parameters:
        - name: level
          in: query
          schema:
            type: string
          description: Code du niveau (ex. TLE)
      responses:
        '200':
          description: Séries disponibles.

  /education/subjects:
    get:
      summary: Liste des matières officielles et coefficients selon le niveau et la série
      tags: [Education]
      parameters:
        - name: level
          in: query
          schema:
            type: string
          description: Code ou UUID du niveau
        - name: track
          in: query
          schema:
            type: string
          description: Code ou UUID de la série (ex. CD)
      responses:
        '200':
          description: Matières, coefficients et volumes horaires officiels.

  /curricula:
    get:
      summary: Programmes scolaires officiels validés et publiés
      tags: [Curricula]
      parameters:
        - name: level
          in: query
          schema:
            type: string
        - name: track
          in: query
          schema:
            type: string
        - name: school_year
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Liste des programmes applicables.

  /curricula/{id}/tree:
    get:
      summary: Arborescence complète du programme (Domaines, Chapitres, Objectifs observables)
      tags: [Curricula]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Arbre hiérarchique avec compétences et objectifs d'apprentissage.

  /resources:
    get:
      summary: Bibliothèque pédagogique publique (Cours, Fiches, Exercices validés et publiés)
      tags: [Resources]
      parameters:
        - name: level_id
          in: query
          schema:
            type: string
        - name: subject_id
          in: query
          schema:
            type: string
        - name: chapter_id
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Ressources publiées conformes aux filtres.

  /resources/{id}:
    get:
      summary: Détails d'une ressource pédagogique avec sources certifiées et fichiers attachés
      tags: [Resources]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détail complet de la ressource.
        '403':
          description: Accès interdit (ressource non publiée ou corrigé restreint).
        '404':
          description: Ressource introuvable.

  /admin/imports:
    post:
      summary: Créer un job d'importation batch de référentiels (Admin uniquement)
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name]
              properties:
                file_name:
                  type: string
                total_rows:
                  type: integer
      responses:
        '201':
          description: Job d'import créé.
        '403':
          description: Réservé aux administrateurs.

  /admin/resources/{id}/submit-review:
    post:
      summary: Soumettre une ressource au comité de relecture éditorial
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ressource passée en relecture.

  /admin/resources/{id}/review:
    post:
      summary: Valider ou rejeter une ressource (Règle d'anti-auto-validation appliquée)
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected, revision_requested]
                comment:
                  type: string
      responses:
        '200':
          description: Décision enregistrée.
        '403':
          description: L'auteur ne peut pas approuver sa propre ressource.

  /admin/resources/{id}/publish:
    post:
      summary: Publier une ressource validée
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ressource publiée et rendue accessible.
        '422':
          description: Ressource non préalablement approuvée.

  /admin/content-versions/{id}/diff:
    get:
      summary: Comparer les versions et détecter les modifications éditoriales
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Diff entre la version actuelle et la précédente.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

